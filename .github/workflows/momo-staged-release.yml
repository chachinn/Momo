name: Momo staged 1.5.1 to 1.7.0 release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: momo-staged-1-5-1-to-1-7-0
  cancel-in-progress: false

jobs:
  staged-release:
    if: github.event.head_commit.message == 'Run Momo staged 1.5.1 to 1.7.0 release'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Lock the Momo 1.5.0 baseline
        shell: bash
        run: |
          test "$(git hash-object app.js)" = "3a05a34b7b96287519ba6d8350d3df10d0f2540d"
          test "$(git hash-object index.html)" = "b9e97fa2989fa6db12f21e0727907d6b285b7c55"
          test "$(git hash-object styles.css)" = "402c68de999ffcf0f7b3ebe74e8dda9290b0b352"
          test "$(git hash-object service-worker.js)" = "3a6fc035b94788ff5c2bbcdd6adff459e0930acf"
          test "$(git hash-object firebase-momo.js)" = "663519f3dcae4390f43b323a0409b33280e0ac59"
          test "$(git hash-object manifest.json)" = "43971593db7fda6efb8512bd69c1d37300f5c589"
          test "$(git hash-object scripts/send-reminders.mjs)" = "eb0d910476cb4e119c8d7f45db011a7bfb955967"
          test "$(git hash-object .github/workflows/momo-reminders.yml)" = "20e6feba42fd52b005ad2efdb2b583cd10f057e9"

      - name: Helper for inline JavaScript QA
        shell: bash
        run: |
          cat > /tmp/check-inline.py <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re, sys
          html=Path('index.html').read_text()
          class IDs(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
          parser=IDs(); parser.feed(html)
          dupes=[name for name,count in Counter(parser.ids).items() if count>1]
          if dupes: raise SystemExit(f'Duplicate HTML ids: {dupes}')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/momo-inline.js').write_text('\n'.join(scripts))
          required=sys.argv[1:]
          missing=[item for item in required if item not in parser.ids]
          if missing: raise SystemExit(f'Missing required HTML ids: {missing}')
          print(f'HTML QA: {len(parser.ids)} unique ids; required IDs present')
          PY

      - name: Apply Momo 1.5.1
        shell: bash
        run: |
          base64 -d scripts/momo-stage-1.5.1.patch.gz.b64 | gzip -d > /tmp/momo-1.5.1.patch
          git apply --check /tmp/momo-1.5.1.patch
          git apply /tmp/momo-1.5.1.patch

      - name: QA Momo 1.5.1 reliability gate
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          cp firebase-momo.js /tmp/firebase-momo.mjs
          node --check /tmp/firebase-momo.mjs
          python /tmp/check-inline.py appUpdateBanner momoWhatsNewModal calendarGrid calendarDayDetails
          node --check /tmp/momo-inline.js
          grep -q 'Momo 1.5.1' app.js
          grep -q 'momo-app-version" content="1.5.1"' index.html
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'buildCalendarMonthIndex' app.js
          grep -q 'navigator.storage?.persist' app.js
          grep -q 'GET_MOMO_VERSION' service-worker.js
          grep -q 'self.addEventListener("push"' service-worker.js
          test "$(git hash-object firebase-momo.js)" = "663519f3dcae4390f43b323a0409b33280e0ac59"
          node <<'NODE'
          const N=100000;
          const expenses=Array.from({length:N},(_,i)=>({date:`2026-08-${String((i%31)+1).padStart(2,'0')}`,amount:(i%100)+1}));
          const totals=new Map(), lists=new Map();
          const start=performance.now();
          for(const e of expenses){if(!e.date.startsWith('2026-08'))continue;if(!lists.has(e.date))lists.set(e.date,[]);lists.get(e.date).push(e);totals.set(e.date,(totals.get(e.date)||0)+e.amount);}
          const elapsed=performance.now()-start;
          for(let d=1;d<=31;d++){const key=`2026-08-${String(d).padStart(2,'0')}`;const old=expenses.filter(e=>e.date===key).reduce((sum,e)=>sum+e.amount,0);if(old!==(totals.get(key)||0))throw new Error(`Calendar index mismatch ${key}`);}
          if(elapsed>5000)throw new Error(`Calendar 100k indexing too slow: ${elapsed}ms`);
          console.log(`MOMO_151_STRESS_OK calendar100k=${elapsed.toFixed(1)}ms`);
          NODE
          git diff --check

      - name: Commit Momo 1.5.1
        shell: bash
        run: |
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add app.js index.html service-worker.js
          git diff --cached --check
          git commit -m "Release Momo 1.5.1: reliability and calendar performance"
          test "$(git hash-object app.js)" = "700bdd41e9176788bc6c62a8585eeea67def878a"
          test "$(git hash-object index.html)" = "0b78271cb74c79986959e40ad90a0a14460f505e"
          test "$(git hash-object styles.css)" = "402c68de999ffcf0f7b3ebe74e8dda9290b0b352"
          test "$(git hash-object service-worker.js)" = "68e4caa9420f37282d6d8a18c7bfd65ac8bb5e74"

      - name: Apply Momo 1.6.0
        shell: bash
        run: |
          base64 -d scripts/momo-stage-1.6.0.patch.gz.b64 | gzip -d > /tmp/momo-1.6.0.patch
          git apply --check /tmp/momo-1.6.0.patch
          git apply /tmp/momo-1.6.0.patch

      - name: QA Momo 1.6.0 planning release
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          python /tmp/check-inline.py momoTodaySection momoSafeToday momoSpentToday momoDueNext7 momoMonthCushion momoProjectedFixed momoActivePayables calendarMonthActual calendarMonthScheduled
          node --check /tmp/momo-inline.js
          grep -q 'Momo 1.6.0' app.js
          grep -q 'momo-app-version" content="1.6.0"' index.html
          grep -q 'function getMomoTodaySnapshot' app.js
          grep -q 'function buildScheduledCashFlow' app.js
          grep -q 'scheduleLists' app.js
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'self.addEventListener("push"' service-worker.js
          test "$(git hash-object firebase-momo.js)" = "663519f3dcae4390f43b323a0409b33280e0ac59"
          node <<'NODE'
          const N=100000;
          const dates=new Map();
          const start=performance.now();
          for(let i=0;i<N;i++){const key=`2026-08-${String((i%31)+1).padStart(2,'0')}`;dates.set(key,(dates.get(key)||0)+(i%250));}
          const total=[...dates.values()].reduce((a,b)=>a+b,0);
          const expected=Array.from({length:N},(_,i)=>i%250).reduce((a,b)=>a+b,0);
          if(total!==expected)throw new Error('Cash-flow aggregation mismatch');
          const elapsed=performance.now()-start;
          if(elapsed>5000)throw new Error(`Cash-flow 100k aggregation too slow: ${elapsed}ms`);
          console.log(`MOMO_160_STRESS_OK cashflow100k=${elapsed.toFixed(1)}ms`);
          NODE
          git diff --check

      - name: Commit Momo 1.6.0
        shell: bash
        run: |
          git add app.js index.html styles.css service-worker.js
          git diff --cached --check
          git commit -m "Release Momo 1.6.0: Momo Today and cash flow"
          test "$(git hash-object app.js)" = "12fbf7541bb9c8958c96db88ece57674cf8d1eb4"
          test "$(git hash-object index.html)" = "2b42e9fbd03ee796030dcb1ac93a6314afa52ccc"
          test "$(git hash-object styles.css)" = "42cc4a301390fc18084c9b5d25f83c70e6113581"
          test "$(git hash-object service-worker.js)" = "28934bba54614f00601319b4aabfdb94c0b1f159"

      - name: Apply Momo 1.7.0
        shell: bash
        run: |
          base64 -d scripts/momo-stage-1.7.0.patch.gz.b64 | gzip -d > /tmp/momo-1.7.0.patch
          git apply --check /tmp/momo-1.7.0.patch
          git apply /tmp/momo-1.7.0.patch

      - name: QA Momo 1.7.0 feature release
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          python /tmp/check-inline.py paydayPlannerForm paydayNextDate paydayExpectedAmount paydayAssignedTotal paydayBufferTotal savingsGoalMode savingsGoalMonthlyPlan savingsGoalProtected savingsProtectedPlan recurringKind recurringTrialEndDate subscriptionActiveCount subscriptionAnnualEstimate subscriptionTrialCount payableInterestAPR
          node --check /tmp/momo-inline.js
          grep -q 'Momo 1.7.0' app.js
          grep -q 'momo-app-version" content="1.7.0"' index.html
          grep -q 'PAYDAY_PLAN_SETTING_KEY' app.js
          grep -q 'getProtectedSavingsRemainingPHP' app.js
          grep -q 'estimatePayablePayoff' app.js
          grep -q 'subscriptionAnnualPHP' app.js
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'self.addEventListener("push"' service-worker.js
          node <<'NODE'
          function estimate(balance,payment,apr){const rate=apr/100/12;let remaining=balance,months=0,interest=0;while(remaining>.005&&months<600){const monthInterest=remaining*rate;if(rate>0&&payment<=monthInterest)return null;interest+=monthInterest;remaining=Math.max(0,remaining+monthInterest-payment);months++;}return months>=600?null:{months,interest};}
          const zero=estimate(12000,1000,0); if(!zero||zero.months!==12||zero.interest!==0)throw new Error('Zero-interest payoff regression');
          const card=estimate(12000,1100,12); if(!card||card.months<11||card.months>13||card.interest<=0)throw new Error('APR payoff regression');
          const goals=Array.from({length:10000},(_,i)=>({protectedJar:i%2===0,monthlyPlan:100+(i%50),contributed:i%70}));
          const start=performance.now(); let protectedTotal=0; for(const g of goals){if(g.protectedJar)protectedTotal+=Math.max(0,g.monthlyPlan-g.contributed);} const elapsed=performance.now()-start;
          if(!Number.isFinite(protectedTotal)||protectedTotal<=0)throw new Error('Peach Jar aggregation regression');
          console.log(`MOMO_170_STRESS_OK jars10k=${elapsed.toFixed(1)}ms payoffMonths=${card.months}`);
          NODE
          git diff --check

      - name: Commit Momo 1.7.0
        shell: bash
        run: |
          git add app.js index.html styles.css service-worker.js
          git diff --cached --check
          git commit -m "Release Momo 1.7.0: Peach Jars payday subscriptions and payables"
          test "$(git hash-object app.js)" = "432b0073c4c1083ea8a4abe93102135b527192e8"
          test "$(git hash-object index.html)" = "ec313743ca2a3ac37cfd82b71542dc150b609de7"
          test "$(git hash-object styles.css)" = "40137cd3049cc20d72fac8e9df02d0a99fcfcde8"
          test "$(git hash-object service-worker.js)" = "a73d6ac7ee2f0a85503808d112c07153fee8b866"

      - name: Final architecture and regression lock
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          cp firebase-momo.js /tmp/firebase-final.mjs
          node --check /tmp/firebase-final.mjs
          python /tmp/check-inline.py appUpdateBanner momoWhatsNewModal momoTodaySection paydayPlannerForm
          node --check /tmp/momo-inline.js
          test "$(git hash-object firebase-momo.js)" = "663519f3dcae4390f43b323a0409b33280e0ac59"
          test "$(git hash-object manifest.json)" = "43971593db7fda6efb8512bd69c1d37300f5c589"
          test "$(git hash-object scripts/send-reminders.mjs)" = "eb0d910476cb4e119c8d7f45db011a7bfb955967"
          test "$(git hash-object .github/workflows/momo-reminders.yml)" = "20e6feba42fd52b005ad2efdb2b583cd10f057e9"
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'GET_MOMO_VERSION' service-worker.js
          grep -q 'SKIP_WAITING' service-worker.js
          grep -q 'momo_update_check' service-worker.js
          grep -q 'notificationApp = initializeApp' firebase-momo.js
          grep -q 'Phone notifications' index.html
          git diff --check

      - name: Clean release helpers and push all verified stages
        shell: bash
        run: |
          git rm .github/workflows/momo-staged-release.yml
          git rm scripts/momo-stage-1.5.1.patch.gz.b64
          git rm scripts/momo-stage-1.6.0.patch.gz.b64
          git rm scripts/momo-stage-1.7.0.patch.gz.b64
          git rm .momo-staged-release-trigger
          git diff --cached --check
          git commit -m "Clean Momo staged release helpers"
          git push origin HEAD:main
