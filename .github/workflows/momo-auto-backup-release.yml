name: Momo 1.10.3 auto-backup release

on:
  push:
    paths:
      - .github/workflows/momo-auto-backup-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/momo-auto-backup-patch.py
      - name: Validate
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check scripts/send-reminders.mjs
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'content="1.10.3"' index.html
          grep -q '"1.10.3";' service-worker.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          grep -q 'writeCurrentDeviceToCloud({ automatic: true })' firebase-momo.js
          grep -q 'runCloudAutoBackupIfDue("online")' firebase-momo.js
          grep -q 'runCloudAutoBackupIfDue("resume")' firebase-momo.js
      - name: Commit release
        run: |
          rm .github/workflows/momo-auto-backup-release.yml
          rm .github/workflows/momo-1.10.3-auto-backup.yml
          rm scripts/momo-auto-backup-patch.py
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Release Momo 1.10.3: daily 8 AM cloud auto backup"
          git push origin HEAD:main
