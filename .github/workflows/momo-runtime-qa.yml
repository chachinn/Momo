name: Momo 1.10.1 mobile runtime QA

on:
  push:
    paths:
      - .github/workflows/momo-runtime-qa.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Install Playwright runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Start local Momo server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/momo-http.log 2>&1 &
          echo $! > /tmp/momo-http.pid
          sleep 1
          curl -f http://127.0.0.1:8765/ >/dev/null

      - name: Run mobile startup navigation and large-history QA
        run: |
          cat > /tmp/momo-runtime-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page = await context.newPage();
            const pageErrors=[];
            const consoleErrors=[];
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });

            const start=Date.now();
            const response = await page.goto('http://127.0.0.1:8765/', {waitUntil:'domcontentloaded', timeout:30000});
            if (!response || !response.ok()) throw new Error('Momo did not load over local HTTP');
            await page.waitForTimeout(1800);
            const startupMs=Date.now()-start;

            // Fresh-install path may show the welcome tour; verify it is usable and dismiss it.
            const tour = page.locator('#welcomeTour');
            if (await tour.count() && await tour.isVisible().catch(()=>false)) {
              const skip = page.locator('#skipWelcomeTour');
              if (!(await skip.isVisible())) throw new Error('Welcome tour is visible but Skip is not usable');
              await skip.click();
              await page.waitForTimeout(150);
            }

            const activeScreen = async () => page.locator('.screen.active').getAttribute('data-screen');
            if ((await activeScreen()) !== 'home') throw new Error(`Expected Home on startup, got ${await activeScreen()}`);

            const navNames = await page.locator('.bottom-nav .nav-item').evaluateAll(nodes => nodes.map(n => n.getAttribute('data-nav')));
            if (JSON.stringify(navNames)!==JSON.stringify(['home','budgets','add','trips','calendar'])) throw new Error(`Bad bottom nav ${JSON.stringify(navNames)}`);

            for (const target of ['budgets','trips','calendar','home']) {
              await page.locator(`.bottom-nav [data-nav="${target}"]`).click();
              await page.waitForTimeout(80);
              if ((await activeScreen()) !== target) throw new Error(`Bottom nav ${target} opened ${await activeScreen()}`);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              if (overflow > 3) throw new Error(`${target} has horizontal overflow of ${overflow}px`);
            }

            // Add is intentionally a normal app screen.
            await page.locator('.bottom-nav [data-nav="add"]').click();
            await page.waitForTimeout(80);
            if ((await activeScreen()) !== 'add') throw new Error(`Add opened ${await activeScreen()}`);
            if (!(await page.locator('#expenseForm').isVisible())) throw new Error('Expense form is not visible');

            // Hamburger: one shortcut grid and every current section opens.
            await page.locator('#menuButton').click();
            await page.waitForTimeout(80);
            if (!(await page.locator('#sideDrawer').getAttribute('aria-hidden') === 'false')) throw new Error('Drawer did not open');
            if ((await page.locator('.drawer-quick-grid').count()) !== 1) throw new Error('Drawer has duplicate shortcut grids');

            const drawerTargets = await page.locator('[data-drawer-nav]').evaluateAll(nodes => [...new Set(nodes.map(n=>n.getAttribute('data-drawer-nav')))]);
            const mustOpen = ['insights','search','future','review','budgets','recurring','savings','payday','payables','activity','receipts','reports','reminders','backup','trips','settlement','converter','dashboard','account','guide'];
            for (const target of mustOpen) {
              await page.locator('#menuButton').click().catch(()=>{});
              await page.waitForTimeout(30);
              const button = page.locator(`[data-drawer-nav="${target}"]`).first();
              if (!(await button.count())) throw new Error(`Drawer target ${target} missing`);
              await button.click();
              await page.waitForTimeout(60);
              if ((await activeScreen()) !== target) throw new Error(`Drawer ${target} opened ${await activeScreen()}`);
            }

            // Populate a realistically large local history directly into IndexedDB.
            await page.goto('http://127.0.0.1:8765/', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(800);
            if (await tour.count() && await tour.isVisible().catch(()=>false)) await page.locator('#skipWelcomeTour').click();

            const largeHistory = await page.evaluate(async () => {
              const openDB = () => new Promise((resolve,reject) => {
                const req=indexedDB.open('momo_database',4);
                req.onsuccess=()=>resolve(req.result);
                req.onerror=()=>reject(req.error);
              });
              const database=await openDB();
              const tx=database.transaction('expenses','readwrite');
              const store=tx.objectStore('expenses');
              const now=new Date();
              for (let i=0;i<2500;i++) {
                const day=String((i%28)+1).padStart(2,'0');
                const month=String(((i%12)+1)).padStart(2,'0');
                store.put({
                  id:`qa-expense-${i}`,
                  title:`QA Expense ${i}`,
                  amount:(i%997)+1,
                  currency:'PHP',
                  category:i%5===0?'Bills':i%5===1?'Food & Drinks':i%5===2?'Shopping':i%5===3?'Transportation':'Other',
                  paymentMethod:i%2?'Cash':'Credit Card',
                  date:`${now.getFullYear()}-${month}-${day}`,
                  location:'',notes:'',photo:'',tripId:'',budgetId:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
                });
              }
              await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});
              const t0=performance.now();
              await loadAppData();
              renderAll();
              return {ms:performance.now()-t0, count:2500};
            });

            if (largeHistory.ms > 2500) throw new Error(`2500-record load+render too slow: ${largeHistory.ms.toFixed(0)}ms`);

            // Exercise the heaviest user-facing screens after the large load.
            const heavyTimes={};
            for (const target of ['home','activity','reports','insights','search','calendar']) {
              const t=Date.now();
              await page.evaluate((target) => showScreen(target), target);
              await page.waitForTimeout(80);
              heavyTimes[target]=Date.now()-t;
              if ((await activeScreen()) !== target) throw new Error(`Large-history navigation failed for ${target}`);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth-window.innerWidth);
              if (overflow > 3) throw new Error(`${target} overflows horizontally after large-history load: ${overflow}px`);
            }

            const viewportMeta = await page.locator('meta[name="viewport"]').getAttribute('content');
            if (!viewportMeta || (!viewportMeta.includes('maximum-scale=1') && !viewportMeta.includes('user-scalable=no'))) throw new Error(`Viewport zoom protection missing: ${viewportMeta}`);

            const meaningfulConsoleErrors = consoleErrors.filter(x => !/firebase|ERR_FAILED|net::/i.test(x));
            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
            if (meaningfulConsoleErrors.length) throw new Error(`Console errors: ${meaningfulConsoleErrors.join(' | ')}`);

            const report = {
              startupMs,
              largeHistoryLoadRenderMs: Number(largeHistory.ms.toFixed(1)),
              largeHistoryRecords: largeHistory.count,
              heavyScreenTimesMs: heavyTimes,
              drawerTargetsFound: drawerTargets.length,
              pageErrors,
              consoleErrorsIgnoredAsNetworkOnly: consoleErrors.filter(x => /firebase|ERR_FAILED|net::/i.test(x)),
              result:'PASS'
            };
            fs.writeFileSync('runtime-qa-report.json', JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/momo-runtime-qa.cjs

      - name: Upload runtime QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-runtime-qa-report
          path: runtime-qa-report.json
          if-no-files-found: warn
          retention-days: 1
