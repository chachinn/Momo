name: Momo 1.10.1 mobile runtime QA

on:
  push:
    paths:
      - .github/workflows/momo-runtime-qa.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Install Playwright runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Start local Momo server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/momo-http.log 2>&1 &
          sleep 1
          curl -f http://127.0.0.1:8765/ >/dev/null

      - name: Run mobile runtime and large-history QA
        run: |
          cat > momo-runtime-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:430,height:932}, deviceScaleFactor:3, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page = await context.newPage();
            page.setDefaultTimeout(6000);
            const pageErrors=[]; const consoleErrors=[];
            page.on('pageerror', e=>pageErrors.push(String(e)));
            page.on('console', m=>{if(m.type()==='error') consoleErrors.push(m.text())});

            const dismissOverlays = async () => {
              if (await page.locator('#welcomeTour').isVisible().catch(()=>false)) {
                const skip=page.locator('#skipWelcomeTour'); if(await skip.isVisible()) await skip.click();
              }
              if (await page.locator('#contextTipModal').isVisible().catch(()=>false)) {
                const got=page.locator('#contextTipGotIt'); if(await got.isVisible()) await got.click();
              }
              if (await page.locator('#momoWhatsNewModal').isVisible().catch(()=>false)) {
                const ack=page.locator('#acknowledgeMomoWhatsNew'); if(await ack.isVisible()) await ack.click();
              }
              await page.waitForTimeout(60);
            };
            const activeScreen=()=>page.locator('.screen.active').getAttribute('data-screen');
            const assertNoOverflow=async(label)=>{const x=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);if(x>3)throw new Error(`${label} horizontal overflow ${x}px`)};

            const start=Date.now();
            const res=await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
            if(!res||!res.ok()) throw new Error('Momo did not load');
            await page.waitForTimeout(1400); await dismissOverlays();
            const startupMs=Date.now()-start;
            if((await activeScreen())!=='home') throw new Error(`Startup screen ${await activeScreen()}`);

            const navNames=await page.locator('.bottom-nav .nav-item').evaluateAll(n=>n.map(x=>x.getAttribute('data-nav')));
            if(JSON.stringify(navNames)!==JSON.stringify(['home','budgets','add','trips','calendar'])) throw new Error(`Bottom nav ${JSON.stringify(navNames)}`);
            for(const target of ['budgets','trips','calendar','home','add']){
              await dismissOverlays(); await page.locator(`.bottom-nav [data-nav="${target}"]`).click(); await page.waitForTimeout(80); await dismissOverlays();
              if((await activeScreen())!==target) throw new Error(`Tab ${target} opened ${await activeScreen()}`); await assertNoOverflow(target);
            }
            if(!(await page.locator('#expenseForm').isVisible())) throw new Error('Expense form hidden');

            await dismissOverlays(); await page.locator('#menuButton').click(); await page.waitForTimeout(80);
            if((await page.locator('#sideDrawer').getAttribute('aria-hidden'))!=='false') throw new Error('Drawer did not open');
            if((await page.locator('.drawer-quick-grid').count())!==1) throw new Error('Duplicate drawer shortcuts');
            const drawerTargets=await page.locator('[data-drawer-nav]').evaluateAll(n=>[...new Set(n.map(x=>x.getAttribute('data-drawer-nav')))]);
            const mustOpen=['insights','search','future','review','budgets','recurring','savings','payday','payables','activity','receipts','reports','reminders','backup','trips','settlement','converter','dashboard','account','guide'];
            for(const target of mustOpen){
              await dismissOverlays();
              if((await page.locator('#sideDrawer').getAttribute('aria-hidden'))!=='false'){await page.locator('#menuButton').click();await page.waitForTimeout(50)}
              const b=page.locator(`[data-drawer-nav="${target}"]`).first(); if(!(await b.count())) throw new Error(`Missing drawer ${target}`);
              await b.click(); await page.waitForTimeout(80); await dismissOverlays();
              if((await activeScreen())!==target) throw new Error(`Drawer ${target} opened ${await activeScreen()}`); await assertNoOverflow(target);
            }

            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'}); await page.waitForTimeout(700); await dismissOverlays();
            const largeHistory=await page.evaluate(async()=>{
              const db=await new Promise((ok,no)=>{const r=indexedDB.open('momo_database',4);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
              const tx=db.transaction('expenses','readwrite'), store=tx.objectStore('expenses'), y=new Date().getFullYear(), stamp=new Date().toISOString();
              for(let i=0;i<2500;i++) store.put({id:`qa-${i}`,title:`QA Expense ${i}`,amount:(i%997)+1,currency:'PHP',category:['Bills','Food & Drinks','Shopping','Transportation','Other'][i%5],paymentMethod:i%2?'Cash':'Credit Card',date:`${y}-${String(i%12+1).padStart(2,'0')}-${String(i%28+1).padStart(2,'0')}`,location:'',notes:'',photo:'',tripId:'',budgetId:'',createdAt:stamp,updatedAt:stamp});
              await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)});
              const t=performance.now(); await loadAppData(); renderAll(); return {ms:performance.now()-t,count:expenses.length};
            });
            if(largeHistory.count<2500) throw new Error(`Large history count ${largeHistory.count}`);
            if(largeHistory.ms>2500) throw new Error(`2500-record load+render ${largeHistory.ms.toFixed(0)}ms`);

            const heavyTimes={};
            for(const target of ['home','activity','reports','insights','search','calendar']){
              const t=performance.now(); await page.evaluate(x=>showScreen(x),target); await page.waitForTimeout(80); heavyTimes[target]=Math.round(performance.now()-t);
              if((await activeScreen())!==target) throw new Error(`Stress screen ${target} failed`); await assertNoOverflow(`stress ${target}`);
            }
            const viewport=await page.locator('meta[name="viewport"]').getAttribute('content');
            if(!viewport||(!viewport.includes('maximum-scale=1')&&!viewport.includes('user-scalable=no'))) throw new Error(`Zoom protection missing: ${viewport}`);
            if(pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
            const meaningful=consoleErrors.filter(x=>!/firebase|ERR_FAILED|net::|favicon/i.test(x)); if(meaningful.length) throw new Error(`Console errors: ${meaningful.join(' | ')}`);

            const report={result:'PASS',startupMs,largeHistoryLoadRenderMs:Number(largeHistory.ms.toFixed(1)),largeHistoryRecords:largeHistory.count,heavyScreenTimesMs:heavyTimes,drawerTargetsFound:drawerTargets.length,pageErrors,ignoredNetworkConsoleErrors:consoleErrors.filter(x=>/firebase|ERR_FAILED|net::|favicon/i.test(x))};
            fs.writeFileSync('runtime-qa-report.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2)); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node momo-runtime-qa.cjs

      - name: Upload runtime QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-runtime-qa-report
          path: runtime-qa-report.json
          if-no-files-found: warn
          retention-days: 1
