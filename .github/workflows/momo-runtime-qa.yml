name: Momo 1.10.2 mobile runtime QA

on:
  push:
    paths:
      - .github/workflows/momo-runtime-qa.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed production build
        run: |
          grep -q 'content="1.10.2"' index.html
          grep -q 'Momo 1.10.2' app.js
          grep -q '"1.10.2";' service-worker.js
          grep -q 'const DB_VERSION = 4;' app.js
          ! grep -q 'convertToPHP(' app.js
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Start Momo locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/momo-http.log 2>&1 &
          sleep 1
          curl -f http://127.0.0.1:8765/ >/dev/null
      - name: Mobile navigation, tutorial, data and stress QA
        run: |
          cat > momo-runtime-qa.cjs <<'JS'
          const { chromium }=require('playwright'); const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            page.setDefaultTimeout(5000);
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const active=()=>page.locator('.screen.active').getAttribute('data-screen');
            const waitForScreen=(target)=>page.waitForFunction(t=>document.querySelector('.screen.active')?.dataset.screen===t,target,{timeout:1500});
            const noOverflow=async n=>{const x=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);if(x>3)throw Error(`${n} overflow ${x}px`)};

            const t0=Date.now(); const r=await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'}); if(!r?.ok())throw Error('startup HTTP failure');
            await page.waitForTimeout(1300);
            if(await page.locator('#welcomeTour').isVisible().catch(()=>false)){if(!(await page.locator('#skipWelcomeTour').isVisible()))throw Error('welcome tour cannot be skipped');await page.locator('#skipWelcomeTour').click()}
            if(await page.locator('#momoWhatsNewModal').isVisible().catch(()=>false)){const b=page.locator('#acknowledgeMomoWhatsNew');if(await b.isVisible())await b.click()}
            await page.waitForTimeout(100); const startupMs=Date.now()-t0;
            if((await active())!=='home')throw Error(`startup=${await active()}`);

            await page.locator('.bottom-nav [data-nav="budgets"]').click(); await waitForScreen('budgets'); await page.waitForTimeout(120);
            let contextTipVerified=false;
            if(await page.locator('#contextTipModal').isVisible().catch(()=>false)){
              const got=page.locator('#contextTipGotIt'); if(!(await got.isVisible()))throw Error('context tip has no usable Got it button'); await got.click(); contextTipVerified=true;
            }
            await page.addStyleTag({content:'#contextTipModal{display:none!important}'});

            const expected=['home','budgets','add','trips','calendar'];
            const names=await page.locator('.bottom-nav .nav-item').evaluateAll(n=>n.map(x=>x.dataset.nav)); if(JSON.stringify(names)!==JSON.stringify(expected))throw Error(`bottom nav ${JSON.stringify(names)}`);
            for(const target of expected){
              await page.locator(`.bottom-nav [data-nav="${target}"]`).click(); await waitForScreen(target);
              if(target==='add' && !(await page.locator('#expenseForm').isVisible()))throw Error('Add expense form hidden while Add is active');
              await noOverflow(target);
            }

            await page.locator('#menuButton').click(); await page.waitForTimeout(80);
            if((await page.locator('#sideDrawer').getAttribute('aria-hidden'))!=='false')throw Error('drawer failed to open');
            if((await page.locator('.drawer-quick-grid').count())!==1)throw Error('drawer shortcut duplication');
            const must=['insights','search','future','review','budgets','recurring','savings','payday','payables','activity','receipts','reports','reminders','backup','trips','settlement','converter','dashboard','account','guide'];
            for(const target of must){
              if((await page.locator('#sideDrawer').getAttribute('aria-hidden'))!=='false'){await page.locator('#menuButton').click();await page.waitForTimeout(60)}
              const b=page.locator(`[data-drawer-nav="${target}"]`).first(); if(!(await b.count()))throw Error(`missing drawer ${target}`); await b.click(); await waitForScreen(target); await noOverflow(target)
            }

            const stress=await page.evaluate(async()=>{
              const db=await new Promise((ok,no)=>{const q=indexedDB.open('momo_database',4);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
              const tx=db.transaction('expenses','readwrite'),s=tx.objectStore('expenses'),y=new Date().getFullYear(),stamp=new Date().toISOString(),cats=['Bills','Food & Drinks','Shopping','Transportation','Other'];
              for(let i=0;i<2500;i++)s.put({id:`qa-${i}`,title:`QA ${i}`,amount:i%997+1,currency:'PHP',category:cats[i%5],paymentMethod:i%2?'Cash':'Credit Card',date:`${y}-${String(i%12+1).padStart(2,'0')}-${String(i%28+1).padStart(2,'0')}`,location:'',notes:'',photo:'',tripId:'',budgetId:'',createdAt:stamp,updatedAt:stamp});
              await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)});
              const t=performance.now();await loadAppData();renderAll();return{ms:performance.now()-t,count:expenses.length};
            });
            if(stress.count<2500)throw Error(`stress count ${stress.count}`); if(stress.ms>2500)throw Error(`stress render ${stress.ms.toFixed(0)}ms`);
            const heavy={}; for(const target of ['home','activity','reports','insights','search','calendar']){const t=Date.now();await page.evaluate(x=>showScreen(x),target);await waitForScreen(target);heavy[target]=Date.now()-t;await noOverflow(`stress-${target}`)}

            const viewport=await page.locator('meta[name="viewport"]').getAttribute('content'); if(!viewport||(!viewport.includes('maximum-scale=1')&&!viewport.includes('user-scalable=no')))throw Error(`zoom protection ${viewport}`);
            if(pageErrors.length)throw Error(`page errors: ${pageErrors.join(' | ')}`);
            const meaningful=consoleErrors.filter(x=>!/firebase|ERR_FAILED|net::|favicon/i.test(x)); if(meaningful.length)throw Error(`console errors: ${meaningful.join(' | ')}`);
            const report={result:'PASS',version:'1.10.2',startupMs,contextTipVerified,stressRecords:stress.count,stressLoadRenderMs:Number(stress.ms.toFixed(1)),heavyScreenTimesMs:heavy,drawerTargetsTested:must.length,pageErrors,ignoredNetworkErrors:consoleErrors.filter(x=>/firebase|ERR_FAILED|net::|favicon/i.test(x))};
            fs.writeFileSync('runtime-qa-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node momo-runtime-qa.cjs
      - name: Upload runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-runtime-qa-report-1.10.2
          path: runtime-qa-report.json
          if-no-files-found: warn
          retention-days: 1
