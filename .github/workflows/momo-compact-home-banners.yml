name: Compact Momo home banners

on:
  push:
    paths:
      - ".github/workflows/momo-compact-home-banners.yml"

permissions:
  contents: write

concurrency:
  group: momo-compact-home-banners
  cancel-in-progress: false

jobs:
  compact-home-banners:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Momo 1.7.0 baseline
        run: |
          grep -q 'name="momo-app-version" content="1.7.0"' index.html
          grep -q 'Momo 1.7.0' app.js
          grep -q '"1.7.0";' service-worker.js
          grep -q '.momo-home-welcome' styles.css
          grep -q '.momo-origin-card' styles.css

      - name: Make the two home banners smaller
        run: |
          cat >> styles.css <<'CSS'

/* ========================================
   MOMO 1.7.1 — COMPACT HOME INTRO BANNERS
   Keeps the same soft visual identity while
   giving the money dashboard more room above
   the fold on phones.
======================================== */

.momo-home-welcome {
  min-height: 150px;
  margin-bottom: 14px;
  padding: 16px 18px;
  grid-template-columns: minmax(0, 1fr) 70px;
  border-radius: 25px;
}

.momo-home-welcome h1 {
  margin: 5px 0 5px;
  font-size: clamp(34px, 9.2vw, 42px);
  line-height: 0.95;
  letter-spacing: -0.04em;
}

.momo-home-welcome p:last-child {
  max-width: 235px;
  font-size: 11px;
  line-height: 1.4;
}

.momo-welcome-peach {
  width: 66px;
  height: 66px;
}

.momo-welcome-peach .welcome-peach-icon {
  --icon-size: 3.35rem;
}

.momo-origin-card {
  margin: 0 0 15px;
  padding: 11px 13px;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 10px;
  border-radius: 19px;
}

.momo-origin-icon {
  width: 38px;
  height: 38px;
  border-radius: 13px;
}

.momo-origin-peach-icon {
  --icon-size: 1.65rem;
}

.momo-origin-card .momo-section-kicker {
  margin-bottom: 2px;
  font-size: 8px;
}

.momo-origin-card h2 {
  margin: 0 0 2px;
  font-size: 14px;
  line-height: 1.24;
}

.momo-origin-card p:last-child {
  font-size: 9.5px;
  line-height: 1.4;
}

@media (max-width: 375px) {
  .momo-home-welcome {
    min-height: 142px;
    padding: 15px 16px;
    grid-template-columns: minmax(0, 1fr) 62px;
  }

  .momo-home-welcome h1 {
    font-size: clamp(31px, 9.6vw, 38px);
  }

  .momo-welcome-peach {
    width: 60px;
    height: 60px;
  }

  .momo-welcome-peach .welcome-peach-icon {
    --icon-size: 3rem;
  }

  .momo-origin-card {
    padding: 10px 12px;
    grid-template-columns: 36px minmax(0, 1fr);
    gap: 9px;
  }

  .momo-origin-icon {
    width: 36px;
    height: 36px;
  }
}
CSS

      - name: Bump visual patch version to 1.7.1
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '<meta name="momo-app-version" content="1.7.0">'
          new = '<meta name="momo-app-version" content="1.7.1">'
          assert old in text, 'index version marker missing'
          index.write_text(text.replace(old, new, 1))

          app = Path('app.js')
          text = app.read_text()
          old = '// Momo 1.7.0 — Peach Jars + Payday Planner + Subscription Center + Payables'
          new = '// Momo 1.7.1 — Compact home banners + Peach Jars + Payday Planner + Subscription Center + Payables'
          assert old in text, 'app version comment missing'
          app.write_text(text.replace(old, new, 1))

          sw = Path('service-worker.js')
          text = sw.read_text()
          old_comment = '// Momo 1.7.0 — update notes + large-list stability + push reminders + network-first PWA shell'
          new_comment = '// Momo 1.7.1 — compact home banners + update notes + large-list stability + push reminders + network-first PWA shell'
          assert old_comment in text, 'service-worker version comment missing'
          text = text.replace(old_comment, new_comment, 1)
          assert '  "1.7.0";' in text, 'service-worker APP_VERSION missing'
          text = text.replace('  "1.7.0";', '  "1.7.1";', 1)
          sw.write_text(text)
          PY

      - name: QA compact banner patch
        run: |
          node --check app.js
          node --check service-worker.js
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('styles.css').read_text()
          html = Path('index.html').read_text()
          sw = Path('service-worker.js').read_text()

          assert css.count('MOMO 1.7.1 — COMPACT HOME INTRO BANNERS') == 1
          assert 'min-height: 150px;' in css
          assert 'grid-template-columns: 38px minmax(0, 1fr);' in css
          assert 'content="1.7.1"' in html
          assert '"1.7.1";' in sw

          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          assert not duplicates, f'duplicate HTML ids: {duplicates}'

          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          PY

      - name: Commit compact banner update and remove helper
        run: |
          rm .github/workflows/momo-compact-home-banners.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js .github/workflows/momo-compact-home-banners.yml
          git commit -m "Release Momo 1.7.1: compact home banners"
          git push origin HEAD:main
