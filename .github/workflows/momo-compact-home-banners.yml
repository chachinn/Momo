name: Compact Momo home banners

on:
  push:
    paths:
      - ".github/workflows/momo-compact-home-banners.yml"

permissions:
  contents: write

concurrency:
  group: momo-compact-home-banners
  cancel-in-progress: false

jobs:
  compact-home-banners:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compact banner patch
        run: python scripts/compact-home-banners.py

      - name: Run JavaScript checks
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Commit Momo 1.7.1 and remove helpers
        run: |
          rm .github/workflows/momo-compact-home-banners.yml
          rm scripts/compact-home-banners.py
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js .github/workflows/momo-compact-home-banners.yml scripts/compact-home-banners.py
          git commit -m "Release Momo 1.7.1: compact home banners"
          git push origin HEAD:main
