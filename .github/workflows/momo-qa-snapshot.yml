name: Momo 1.10.1 full QA snapshot

on:
  push:
    paths:
      - .github/workflows/momo-qa-snapshot.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-momo.js
          node --check scripts/send-reminders.mjs

      - name: Static regression and structure QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, time

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))

          report=[]
          def check(name, condition, detail=''):
              if not condition:
                  raise AssertionError(f'{name}: {detail}')
              report.append(f'PASS | {name}' + (f' | {detail}' if detail else ''))

          check('App version meta', 'content="1.10.1"' in html)
          check('Service worker version', '"1.10.1";' in sw)
          check('App header version', 'Momo 1.10.1' in app)
          check('IndexedDB schema preserved', 'const DB_VERSION = 4;' in app)
          check('Manifest standalone', manifest.get('display') == 'standalone', str(manifest.get('display')))

          ids = re.findall(r'\bid="([^"]+)"', html)
          dup_ids = sorted({x for x in ids if ids.count(x)>1})
          check('No duplicate HTML IDs', not dup_ids, str(dup_ids[:20]))

          screens = re.findall(r'data-screen="([^"]+)"', html)
          dup_screens = sorted({x for x in screens if screens.count(x)>1})
          check('Unique screens', not dup_screens, str(dup_screens))
          screen_set=set(screens)

          nav_targets = re.findall(r'data-nav="([^"]+)"', html)
          drawer_targets = re.findall(r'data-drawer-nav="([^"]+)"', html)
          allowed_special={'add'}
          missing = sorted({x for x in nav_targets + drawer_targets if x not in screen_set and x not in allowed_special})
          check('Navigation targets resolve', not missing, str(missing))

          nav = re.search(r'<nav\b[^>]*class="bottom-nav".*?</nav>', html, re.S)
          check('Bottom navigation exists', bool(nav))
          nav_names = re.findall(r'data-nav="([^"]+)"', nav.group(0)) if nav else []
          check('Bottom navigation order', nav_names == ['home','budgets','add','trips','calendar'], str(nav_names))
          check('Single drawer shortcut grid', html.count('class="drawer-quick-grid"') == 1, str(html.count('class="drawer-quick-grid"')))

          check('CSS braces balanced', css.count('{') == css.count('}'), f"{css.count('{')} / {css.count('}')}")
          check('No stale release helper', 'momo-next-wave' not in html + app + css + sw)

          core_shell = re.search(r'const CORE_SHELL\s*=\s*\[(.*?)\];', sw, re.S)
          if core_shell:
              refs = re.findall(r'"\./([^"?]+)', core_shell.group(1))
              missing_assets=[p for p in refs if p and not Path(p).exists()]
              check('Service worker shell assets exist', not missing_assets, str(missing_assets))

          # Duplicate top-level function declarations are a useful regression signal.
          fn_names = re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(', app, re.M)
          dup_fns = sorted({x for x in fn_names if fn_names.count(x)>1})
          # Intentional overrides should be assignments rather than duplicate declarations in current Momo.
          check('No duplicate function declarations', not dup_fns, str(dup_fns[:30]))

          feature_markers = [
            'momoNoticesList','momoForecastSpend','momoMonthCloseList','momoBudgetRolloverList',
            'momoGlobalSearchInput','momoHomeModuleList','momoWorthItList','momoNoSpendCalendar',
            'momoFutureList','momoReviewYear','momoSubscriptionManager','momoJarPlanner','momoPayoffSelect',
            'drawerReminderBadge','drawerAccountTitle'
          ]
          missing_markers=[x for x in feature_markers if x not in html+app]
          check('1.8-1.10 feature markers present', not missing_markers, str(missing_markers))

          start=time.perf_counter()
          total=0
          for i in range(250000):
              total += (i % 997) + 1
          elapsed=time.perf_counter()-start
          check('250k-record synthetic one-pass performance', elapsed < 5, f'{elapsed:.3f}s')

          Path('qa-report.txt').write_text('\n'.join(report) + f'\nINFO | HTML IDs: {len(ids)}\nINFO | Screens: {len(screens)}\nINFO | app.js bytes: {Path("app.js").stat().st_size}\nINFO | styles.css bytes: {Path("styles.css").stat().st_size}\n', encoding='utf-8')
          print(Path('qa-report.txt').read_text())
          PY

      - name: Package exact current production tree
        run: |
          mkdir -p qa-package/.github/workflows qa-package/scripts qa-package/icons
          cp app.js firebase-momo.js index.html manifest.json service-worker.js styles.css qa-package/
          cp scripts/send-reminders.mjs qa-package/scripts/
          cp .github/workflows/momo-reminders.yml qa-package/.github/workflows/
          cp icons/* qa-package/icons/
          cp qa-report.txt qa-package/
          cd qa-package
          zip -r ../momo-1.10.1-current-main.zip .

      - name: Upload QA snapshot
        uses: actions/upload-artifact@v4
        with:
          name: momo-1.10.1-current-main
          path: momo-1.10.1-current-main.zip
          if-no-files-found: error
          retention-days: 1
