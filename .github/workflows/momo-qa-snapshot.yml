name: Momo 1.10.2 final static QA

on:
  push:
    paths:
      - .github/workflows/momo-qa-snapshot.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-momo.js
          node --check scripts/send-reminders.mjs
      - name: Static structure data-safety and performance QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, time
          html=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('styles.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          report=[]
          def check(name, cond, detail=''):
            if not cond: raise AssertionError(f'{name}: {detail}')
            report.append(f'PASS | {name}' + (f' | {detail}' if detail else ''))

          check('App version meta','content="1.10.2"' in html)
          check('Service worker version','"1.10.2";' in sw)
          check('App header version','Momo 1.10.2' in app)
          check('IndexedDB schema preserved','const DB_VERSION = 4;' in app)
          check('Activity broken helper removed','convertToPHP(' not in app)
          check('Activity PHP conversion uses supported helper', bool(re.search(r'convertCurrency\(\s*expense\.amount\s*,\s*expense\.currency\s*,\s*"PHP"\s*\)', app)))
          check('Manifest standalone',manifest.get('display')=='standalone',str(manifest.get('display')))

          ids=re.findall(r'\bid="([^"]+)"',html)
          dup_ids=sorted({x for x in ids if ids.count(x)>1})
          check('No duplicate HTML IDs',not dup_ids,str(dup_ids[:20]))
          screens=re.findall(r'data-screen="([^"]+)"',html)
          dup_screens=sorted({x for x in screens if screens.count(x)>1})
          check('Unique screens',not dup_screens,str(dup_screens))
          screen_set=set(screens)
          targets=re.findall(r'data-nav="([^"]+)"',html)+re.findall(r'data-drawer-nav="([^"]+)"',html)
          missing=sorted({x for x in targets if x not in screen_set and x!='add'})
          check('Navigation targets resolve',not missing,str(missing))
          nav=re.search(r'<nav\b[^>]*class="bottom-nav".*?</nav>',html,re.S)
          check('Bottom navigation exists',bool(nav))
          names=re.findall(r'data-nav="([^"]+)"',nav.group(0)) if nav else []
          check('Bottom navigation order',names==['home','budgets','add','trips','calendar'],str(names))
          check('Single drawer shortcut grid',html.count('class="drawer-quick-grid"')==1,str(html.count('class="drawer-quick-grid"')))
          check('CSS braces balanced',css.count('{')==css.count('}'),f"{css.count('{')} / {css.count('}')}")

          core=re.search(r'const CORE_SHELL\s*=\s*\[(.*?)\];',sw,re.S)
          if core:
            refs=re.findall(r'"\./([^"?]+)',core.group(1))
            absent=[p for p in refs if p and not Path(p).exists()]
            check('Service worker shell assets exist',not absent,str(absent))

          fn=re.findall(r'^function\s+([A-Za-z_$][\w$]*)\s*\(',app,re.M)
          dup_fn=sorted({x for x in fn if fn.count(x)>1})
          check('No duplicate function declarations',not dup_fn,str(dup_fn[:30]))
          markers=['momoNoticesList','momoForecastSpend','momoMonthCloseList','momoBudgetRolloverList','momoGlobalSearchInput','momoHomeModuleList','momoWorthItList','momoNoSpendCalendar','momoFutureList','momoReviewYear','momoSubscriptionManager','momoJarPlanner','momoPayoffSelect','drawerReminderBadge','drawerAccountTitle']
          missing_markers=[x for x in markers if x not in html+app]
          check('1.8-1.10 feature markers present',not missing_markers,str(missing_markers))
          check('Local clean-start does not clear IndexedDB','Never clear IndexedDB here' in app and 'localStorage.removeItem' in app)

          start=time.perf_counter(); total=0
          for i in range(250000): total+=(i%997)+1
          elapsed=time.perf_counter()-start
          check('250k-record synthetic one-pass performance',elapsed<5,f'{elapsed:.3f}s')
          report.extend([f'INFO | HTML IDs: {len(ids)}',f'INFO | Screens: {len(screens)}',f'INFO | app.js bytes: {Path("app.js").stat().st_size}',f'INFO | styles.css bytes: {Path("styles.css").stat().st_size}'])
          Path('qa-report-1.10.2.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report))
          PY
      - name: Upload static QA report
        uses: actions/upload-artifact@v4
        with:
          name: momo-static-qa-report-1.10.2
          path: qa-report-1.10.2.txt
          if-no-files-found: error
          retention-days: 1
