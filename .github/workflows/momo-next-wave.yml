name: Momo v1.8-v1.10 release wave

on:
  push:
    paths:
      - ".github/workflows/momo-next-wave.yml"

permissions:
  contents: write

concurrency:
  group: momo-next-wave-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.head_commit.message == 'Run Momo v1.8-v1.10 release wave'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean Momo 1.7.1 baseline
        run: |
          grep -q 'content="1.7.1"' index.html
          grep -q 'Momo 1.7.1' app.js
          grep -q '"1.7.1";' service-worker.js
          grep -q 'const DB_VERSION = 4;' app.js
          test -f firebase-momo.js
          test -f manifest.json
          test -f scripts/send-reminders.mjs
          test -f .github/workflows/momo-reminders.yml

      - name: Rebuild verified patch helper
        run: |
          cat scripts/momo-next-wave.part00 scripts/momo-next-wave.part01 scripts/momo-next-wave.part02a scripts/momo-next-wave.part02b scripts/momo-next-wave.part03 scripts/momo-next-wave.part04 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/momo-next-wave.py
          python -m py_compile /tmp/momo-next-wave.py

      - name: Lock protected infrastructure hashes
        run: |
          sha256sum firebase-momo.js manifest.json scripts/send-reminders.mjs .github/workflows/momo-reminders.yml > /tmp/momo-protected.sha256

      - name: Build and QA Momo 1.8.0
        run: |
          python /tmp/momo-next-wave.py 1.8
          node --check app.js
          node --check service-worker.js
          python /tmp/momo-next-wave.py qa 1.8.0
          sha256sum -c /tmp/momo-protected.sha256

      - name: Commit Momo 1.8.0
        run: |
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js
          git commit -m "Release Momo 1.8.0: insights and forecasting"
          git push origin HEAD:main

      - name: Build and QA Momo 1.9.0
        run: |
          python /tmp/momo-next-wave.py 1.9
          node --check app.js
          node --check service-worker.js
          python /tmp/momo-next-wave.py qa 1.9.0
          sha256sum -c /tmp/momo-protected.sha256

      - name: Commit Momo 1.9.0
        run: |
          git add app.js index.html styles.css service-worker.js
          git commit -m "Release Momo 1.9.0: search customization and navigation cleanup"
          git push origin HEAD:main

      - name: Build and QA Momo 1.10.0
        run: |
          python /tmp/momo-next-wave.py 1.10
          node --check app.js
          node --check service-worker.js
          python /tmp/momo-next-wave.py qa 1.10.0
          sha256sum -c /tmp/momo-protected.sha256
          grep -q 'data-nav="home"' index.html
          grep -q 'data-nav="budgets"' index.html
          grep -q 'data-nav="add"' index.html
          grep -q 'data-nav="trips"' index.html
          grep -q 'data-nav="calendar"' index.html
          test "$(grep -o 'class="nav-item' index.html | wc -l | tr -d ' ')" -eq 5

      - name: Final cleanup and release Momo 1.10.0
        run: |
          rm -f scripts/momo-next-wave.part00 scripts/momo-next-wave.part01 scripts/momo-next-wave.part02 scripts/momo-next-wave.part02a scripts/momo-next-wave.part02b scripts/momo-next-wave.part03 scripts/momo-next-wave.part04
          rm -f .github/workflows/momo-next-wave.yml
          git add -A
          git commit -m "Release Momo 1.10.0: smart money suite and clean navigation"
          git push origin HEAD:main
