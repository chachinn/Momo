name: Momo 1.10.1 polish

on:
  push:
    paths:
      - .github/workflows/momo-1.10.1-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify baseline
        run: |
          grep -q 'content="1.10.0"' index.html
          grep -q 'const DB_VERSION = 4;' app.js
          test -f scripts/momo-polish-1.10.1.py

      - name: Protect infrastructure
        run: sha256sum firebase-momo.js manifest.json scripts/send-reminders.mjs .github/workflows/momo-reminders.yml > /tmp/protected.sha256

      - name: Apply polish
        run: python scripts/momo-polish-1.10.1.py

      - name: QA JavaScript and protected files
        run: |
          node --check app.js
          node --check service-worker.js
          sha256sum -c /tmp/protected.sha256

      - name: Commit release
        run: |
          rm scripts/momo-polish-1.10.1.py
          rm .github/workflows/momo-1.10.1-polish.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Release Momo 1.10.1: final navigation polish"
          git push origin HEAD:main
