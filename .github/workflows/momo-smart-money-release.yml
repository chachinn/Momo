name: Momo Smart Money QA Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qa:
    if: github.head_ref == 'agent/momo-smart-money-v1-11'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Smart Money branch
        uses: actions/checkout@v4
        with:
          ref: agent/momo-smart-money-v1-11
          fetch-depth: 0

      - name: Static release gates
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          test -f index.html
          test -f styles.css
          test -f manifest.json
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/apple-touch-icon.png
          test -f .github/workflows/momo-reminders.yml
          test -f scripts/send-reminders.mjs
          test ! -e scripts/momo-smart-money-release.mjs
          test ! -e .github/workflows/momo-smart-money-release.yml
          grep -q 'content="1.11.0"' index.html
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'smart-money.js' index.html
          grep -q 'smart-money.js' service-worker.js
          git diff --check origin/main...HEAD

      - name: Install browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Run populated mobile regression
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          cat > /tmp/momo-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));

          await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);

          await page.evaluate(async () => {
            const open = () => new Promise((resolve, reject) => {
              const request = indexedDB.open('momo_database', 4);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            const db = await open();
            const tx = db.transaction(['expenses','budgets','recurring','planned','cards','settings'], 'readwrite');
            const expenses = tx.objectStore('expenses');
            const budgets = tx.objectStore('budgets');
            const recurring = tx.objectStore('recurring');
            const planned = tx.objectStore('planned');
            const cards = tx.objectStore('cards');
            const settings = tx.objectStore('settings');
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            for (let i = 0; i < 2500; i += 1) {
              const date = new Date(now.getFullYear(), now.getMonth() - (i % 4), 1 + (i % 25));
              expenses.put({
                id: `qa-exp-${i}`,
                amount: 80 + (i % 900),
                currency: 'PHP',
                date: date.toISOString().slice(0,10),
                category: i % 5 === 0 ? 'Food & Drinks' : i % 5 === 1 ? 'Transportation' : 'Shopping',
                merchant: `QA Merchant ${i % 40}`,
                paymentMethod: i % 2 ? 'Cash' : 'Card'
              });
            }

            for (let m = 0; m < 4; m += 1) {
              const date = new Date(now.getFullYear(), now.getMonth() - m, 8);
              expenses.put({ id: `qa-netflix-${m}`, amount: 599, currency: 'PHP', date: date.toISOString().slice(0,10), category: 'Entertainment', merchant: 'QA Stream' });
            }
            expenses.put({ id: 'qa-dup-a', amount: 888, currency: 'PHP', date: now.toISOString().slice(0,10), category: 'Shopping', merchant: 'QA Duplicate' });
            expenses.put({ id: 'qa-dup-b', amount: 888, currency: 'PHP', date: now.toISOString().slice(0,10), category: 'Shopping', merchant: 'QA Duplicate' });

            budgets.put({ id: 'qa-budget', name: 'Monthly', amount: 120000, currency: 'PHP', period: 'monthly', category: 'All' });
            const due = new Date(now); due.setDate(now.getDate() + 3);
            recurring.put({ id: 'qa-recurring', name: 'QA Bill', amount: 2200, currency: 'PHP', nextDueDate: due.toISOString().slice(0,10), active: true });
            const future = new Date(now); future.setDate(now.getDate() + 5);
            planned.put({ id: 'qa-future', name: 'QA Future Buy', amount: 3500, currency: 'PHP', targetDate: future.toISOString().slice(0,10), status: 'planned' });
            cards.put({ id: 'qa-card', name: 'QA Card', remainingBalance: 18000, minimumPayment: 1500, apr: 18, currency: 'PHP', dueDate: due.toISOString().slice(0,10) });
            const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
            settings.put({ key: 'monthly_income', value: { [key]: 150000 } });
            settings.put({ key: 'savings_goals', value: [{ id:'qa-jar', name:'QA Peach Jar', targetAmount:50000, currentAmount:12000, targetDate:new Date(now.getFullYear(), now.getMonth()+6, 1).toISOString().slice(0,10) }] });
            settings.put({ key: 'payday_plan_v1', value: { savings: 5000 } });

            await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
            db.close();
          });

          const started = Date.now();
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForSelector('#momoKnowsSection', { state: 'attached', timeout: 8000 });
          await page.waitForFunction(() => window.MomoSmartMoney?.version === '1.11.0', null, { timeout: 8000 });
          await page.waitForTimeout(900);
          const populatedRenderMs = Date.now() - started;

          const smart = await page.evaluate(() => ({
            version: window.MomoSmartMoney?.version,
            insightCount: window.MomoSmartMoney?.buildInsights?.().insights?.length || 0,
            safeText: document.getElementById('momoSafeToday')?.textContent?.trim() || '',
            knowsText: document.getElementById('momoKnowsList')?.textContent?.trim() || '',
            overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
            dbVersion: 4
          }));

          assert.equal(smart.version, '1.11.0');
          assert.ok(smart.insightCount >= 3, `Expected >=3 smart insights, got ${smart.insightCount}`);
          assert.ok(smart.safeText && smart.safeText !== '—', 'Smart Safe to Spend was not rendered');
          assert.ok(smart.knowsText.length > 20, 'Momo Knows did not render meaningful content');
          assert.ok(smart.overflow <= 1, `Horizontal overflow detected: ${smart.overflow}px`);
          assert.ok(populatedRenderMs < 8000, `Populated mobile render too slow: ${populatedRenderMs}ms`);

          for (const target of ['home','budgets','trips','calendar']) {
            const button = page.locator(`[data-nav="${target}"]`).first();
            assert.ok(await button.count(), `Missing navigation target ${target}`);
            await button.click();
            await page.waitForTimeout(120);
          }

          const menu = page.locator('#menuButton');
          await menu.click();
          await page.waitForTimeout(120);
          assert.equal(await page.locator('#sideDrawer').getAttribute('aria-hidden'), 'false');

          assert.deepEqual(errors, [], `Page errors: ${errors.join(' | ')}`);
          console.log(JSON.stringify({ populatedRenderMs, insightCount: smart.insightCount, safeText: smart.safeText }));
          await browser.close();
          EOF
          node /tmp/momo-qa.mjs
