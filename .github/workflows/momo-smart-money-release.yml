name: Momo Smart Money QA Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  qa:
    if: github.head_ref == 'agent/momo-smart-money-v1-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/momo-smart-money-v1-11
          fetch-depth: 0

      - name: Harden Smart Money refresh behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('smart-money.js')
          text = path.read_text()
          text = text.replace('  let observer = null;\n', '')
          old = '''  function watchForChanges() {
            if (observer || !document.body) return;
            observer = new MutationObserver((mutations) => {
              if (mutations.some((mutation) => mutation.type === "childList" && mutation.addedNodes.length)) {
                scheduleRefresh();
              }
            });
            observer.observe(document.body, { childList: true, subtree: true });
            window.addEventListener("focus", scheduleRefresh, { passive: true });
            window.addEventListener("online", scheduleRefresh, { passive: true });
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") scheduleRefresh();
            });
          }
          '''
          new = '''  function watchForChanges() {
            window.addEventListener("focus", scheduleRefresh, { passive: true });
            window.addEventListener("online", scheduleRefresh, { passive: true });
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") scheduleRefresh();
            });

            // Refresh after real user data actions instead of observing every DOM
            // mutation. This prevents Momo Knows from creating a render/observer
            // feedback loop on long-running sessions with large histories.
            document.addEventListener("submit", () => {
              window.setTimeout(scheduleRefresh, 650);
            }, true);

            document.addEventListener("momo-data-changed", scheduleRefresh);
          }
          '''
          if old in text:
              text = text.replace(old, new)
          elif 'new MutationObserver' in text:
              raise SystemExit('Smart Money observer block changed unexpectedly; refusing automatic patch')
          path.write_text(text)
          PY

          if ! git diff --quiet -- smart-money.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add smart-money.js
            git commit -m "Harden Momo Smart Money refresh performance"
            git push origin HEAD:agent/momo-smart-money-v1-11
          fi

      - name: Static release gates
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          test -f .github/workflows/momo-reminders.yml
          test ! -e scripts/momo-smart-money-release.mjs
          test ! -e .github/workflows/momo-smart-money-release.yml
          grep -q 'content="1.11.0"' index.html
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'smart-money.js' index.html
          grep -q 'smart-money.js' service-worker.js
          ! grep -q 'new MutationObserver' smart-money.js
          git diff --check origin/main...HEAD

      - name: Browser QA setup
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Populated mobile regression
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          cat > momo-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({ headless:true });
          const context = await browser.newContext({ viewport:{width:390,height:844}, isMobile:true, hasTouch:true });
          const page = await context.newPage();
          const errors=[]; page.on('pageerror', e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(900);
          await page.evaluate(async()=>{
            const db=await new Promise((res,rej)=>{const r=indexedDB.open('momo_database',4);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
            const tx=db.transaction(['expenses','budgets','recurring','planned','cards','settings'],'readwrite');
            const ex=tx.objectStore('expenses'), bu=tx.objectStore('budgets'), re=tx.objectStore('recurring'), pl=tx.objectStore('planned'), ca=tx.objectStore('cards'), se=tx.objectStore('settings');
            const now=new Date();
            for(let i=0;i<2500;i++){const d=new Date(now.getFullYear(),now.getMonth()-(i%4),1+(i%25));ex.put({id:`qa-${i}`,amount:80+(i%900),currency:'PHP',date:d.toISOString().slice(0,10),category:i%3===0?'Food & Drinks':i%3===1?'Transportation':'Shopping',merchant:`QA Merchant ${i%40}`,paymentMethod:i%2?'Cash':'Card'});}
            for(let m=0;m<4;m++){const d=new Date(now.getFullYear(),now.getMonth()-m,8);ex.put({id:`stream-${m}`,amount:599,currency:'PHP',date:d.toISOString().slice(0,10),category:'Entertainment',merchant:'QA Stream'});}
            const today=now.toISOString().slice(0,10); ex.put({id:'dup-a',amount:888,currency:'PHP',date:today,category:'Shopping',merchant:'QA Duplicate'}); ex.put({id:'dup-b',amount:888,currency:'PHP',date:today,category:'Shopping',merchant:'QA Duplicate'});
            bu.put({id:'budget',name:'Monthly',amount:120000,currency:'PHP',period:'monthly',category:'All'});
            const due=new Date(now);due.setDate(now.getDate()+3); re.put({id:'bill',name:'QA Bill',amount:2200,currency:'PHP',nextDueDate:due.toISOString().slice(0,10),active:true});
            const future=new Date(now);future.setDate(now.getDate()+5); pl.put({id:'future',name:'QA Future Buy',amount:3500,currency:'PHP',targetDate:future.toISOString().slice(0,10),status:'planned'});
            ca.put({id:'card',name:'QA Card',remainingBalance:18000,minimumPayment:1500,apr:18,currency:'PHP',dueDate:due.toISOString().slice(0,10)});
            const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`; se.put({key:'monthly_income',value:{[key]:150000}}); se.put({key:'savings_goals',value:[{id:'jar',name:'QA Peach Jar',targetAmount:50000,currentAmount:12000,targetDate:new Date(now.getFullYear(),now.getMonth()+6,1).toISOString().slice(0,10)}]}); se.put({key:'payday_plan_v1',value:{savings:5000}});
            await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}); db.close();
          });
          const started=Date.now(); await page.reload({waitUntil:'domcontentloaded'}); await page.waitForFunction(()=>window.MomoSmartMoney?.version==='1.11.0',null,{timeout:8000}); await page.waitForTimeout(700); const ms=Date.now()-started;
          const result=await page.evaluate(()=>({count:window.MomoSmartMoney.buildInsights().insights.length,safe:document.getElementById('momoSafeToday')?.textContent?.trim(),knows:document.getElementById('momoKnowsList')?.textContent?.trim(),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          assert.ok(result.count>=3); assert.ok(result.safe&&result.safe!=='—'); assert.ok(result.knows?.length>20); assert.ok(result.overflow<=1); assert.ok(ms<8000);

          // Navigation QA is not an onboarding test. Retire the legitimate first-run
          // tutorial overlay so we can physically tap the real bottom navigation.
          await page.evaluate(()=>{const tour=document.getElementById('welcomeTour');if(tour){tour.hidden=true;tour.style.display='none';}document.body.classList.remove('tutorial-open','modal-open','drawer-open');});
          for(const target of ['home','budgets','trips','calendar']){const b=page.locator(`[data-nav="${target}"]`).first();assert.ok(await b.count());await b.click();await page.waitForTimeout(100);}
          await page.locator('#menuButton').click(); await page.waitForTimeout(100); assert.equal(await page.locator('#sideDrawer').getAttribute('aria-hidden'),'false');
          assert.deepEqual(errors,[]); console.log(JSON.stringify({populatedRenderMs:ms,insightCount:result.count,safe:result.safe})); await browser.close();
          EOF
          node momo-qa.mjs
