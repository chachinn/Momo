name: Momo 1.10.3 syntax repair

on:
  push:
    paths:
      - .github/workflows/momo-1103-syntax-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/momo-1103-confirm-fix.py
      - run: node --check firebase-momo.js
      - run: |
          rm .github/workflows/momo-1103-syntax-repair.yml
          rm scripts/momo-1103-confirm-fix.py
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fix Momo 1.10.3 cloud upload syntax"
          git push origin HEAD:main
